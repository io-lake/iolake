# Release binaries for x86_64 and arm64, built on every merge to main and
# on demand for any branch (Actions → binaries → Run workflow, or
# `gh workflow run binaries.yml --ref <branch>`).
#
# They are for test machines (objectio-infra's `deploy fetch`): a fresh
# cloud cluster used to spend ~40 minutes compiling on one of its own
# nodes (four cores, RocksDB's C++ and all) before a benchmark could
# start. Not a release: that is release.yml, from a tag.

name: binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: binaries (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The cache keeps RocksDB's C++ build too: rebuilt only when its
      # version changes.
      - uses: Swatinem/rust-cache@v2
        with:
          key: binaries-${{ matrix.arch }}
      # ISA-L (every build erasure-codes with it) is built from source:
      # autotools on both, NASM on x86_64 only (installed on both, unused
      # on arm64).
      - name: build dependencies
        timeout-minutes: 25
        run: |
          scripts/ci/apt-install.sh protobuf-compiler nasm autoconf automake libtool libclang-dev mold
      # aio embeds the console.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: console
        working-directory: console
        run: npm ci && npm run build
      - name: build
        env:
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: |
          features=iolake-osd-bin/io-uring,iolake-osd-bin/rocksdb,iolake-aio/io-uring,iolake-aio/rocksdb
          cargo build --release --features "$features" \
            --bin iolake-meta --bin iolake-osd --bin iolake-gateway --bin iolake-aio --bin iolakectl
          mkdir -p out
          cp target/release/iolake-meta target/release/iolake-osd target/release/iolake-gateway \
            target/release/iolake-aio target/release/iolakectl out/
          cd out
          echo "${{ github.sha }}" > REF
          sha256sum iolake-* iolakectl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: iolake-linux-${{ matrix.arch }}
          path: out/
          retention-days: 30
