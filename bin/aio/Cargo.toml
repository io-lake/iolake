[package]
name = "iolake-aio"
description = "IOLake all-in-one — single-command supervisor for meta + OSD + gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
# Creates console/dist when missing so a fresh clone can build; see build.rs.
build = "build.rs"

[[bin]]
name = "iolake-aio"
path = "src/main.rs"

[dependencies]
# aio links directly against each service crate's lib — they run as
# tokio tasks in the same process, not as child processes. One
# tracing subscriber, one signal handler, one memory space.
iolake-meta = { workspace = true }
iolake-osd = { workspace = true }
iolake-gateway = { workspace = true }
iolake-block-gateway = { workspace = true }
iolake-proto = { workspace = true }
iolake-common = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
which = "6"
tempfile = "3"
include_dir = "0.7"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

[features]
default = []
# Propagates to iolake-osd → iolake-storage. Linux-only win; safe
# no-op elsewhere. Enable on Linux release builds to get +25%
# throughput + -43% p99.9 on 4 MiB object stripes.
io-uring = ["iolake-osd/io-uring"]
# The OSDs' metadata index on RocksDB, with --meta-engine rocksdb.
rocksdb = ["iolake-osd/rocksdb"]
# Shard transfers over Mooncake Transfer Engine between the embedded gateway
# and OSDs, turned on with `--rdma`. Linux only; needs a Mooncake build.
rdma = ["iolake-gateway/rdma", "iolake-osd/rdma"]
# Pluggable grep engines — propagate into the embedded gateway.
# pcre2 needs libpcre2-dev at build time; hyperscan needs
# libhyperscan-dev (Linux x86_64 primary). Off by default so
# macOS / Windows builds stay pure-Rust.
grep-pcre2 = ["iolake-gateway/pcre2"]
grep-hyperscan = ["iolake-gateway/hyperscan"]
