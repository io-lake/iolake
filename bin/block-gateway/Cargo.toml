[package]
name = "iolake-block-gateway-bin"
description = "The iolake-block-gateway binary: the block gateway (the code is in crates/block-gateway)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "iolake-block-gateway"
path = "src/main.rs"

[dependencies]
iolake-block-gateway = { workspace = true }
iolake-common = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
