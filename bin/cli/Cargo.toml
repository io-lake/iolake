[package]
name = "iolake-cli"
description = "Management CLI for IOLake: a SigV4 client of the gateway's admin API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iolakectl"
path = "src/main.rs"

[dependencies]
# Block volume/snapshot commands speak gRPC to the block gateway; nothing
# else in the CLI uses the proto crate (there is no metadata client).
iolake-proto = { workspace = true }
# validate_scope, to refuse a malformed key scope before sending it.
iolake-auth = { workspace = true }
iolake-common = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { workspace = true }
toml = "0.8"

[dev-dependencies]
http = "1"
tempfile = { workspace = true }

[lints]
workspace = true
