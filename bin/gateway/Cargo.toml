[package]
name = "iolake-gateway-bin"
description = "The iolake-gateway binary: the S3 API gateway (the code is in crates/gateway)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "iolake-gateway"
path = "src/main.rs"

[dependencies]
iolake-gateway = { workspace = true }
iolake-common = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

[features]
default = []
# Shard transfers over Mooncake Transfer Engine.
rdma = ["iolake-gateway/rdma"]
# The PCRE2 grep engine.
pcre2 = ["iolake-gateway/pcre2"]
# The Hyperscan grep engine.
hyperscan = ["iolake-gateway/hyperscan"]
