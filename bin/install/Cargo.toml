[package]
name = "iolake-install"
description = "Sets a host up to run IOLake's services under systemd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iolake-install"
path = "src/main.rs"

[dependencies]
iolake-storage = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `cluster init` calls the meta nodes' admin ports.
reqwest = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
