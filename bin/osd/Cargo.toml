[package]
name = "iolake-osd-bin"
description = "The iolake-osd binary: the storage daemon (OSD) (the code is in crates/osd)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "iolake-osd"
path = "src/main.rs"

[dependencies]
iolake-osd = { workspace = true }
iolake-common = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }

[features]
default = []
# Shard I/O through io_uring (Linux).
io-uring = ["iolake-osd/io-uring"]
# Shard transfers over Mooncake Transfer Engine.
rdma = ["iolake-osd/rdma"]
# The metadata index on RocksDB, with --meta-engine rocksdb.
rocksdb = ["iolake-osd/rocksdb"]
