[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is "iolake-sdk"; the import is `iolake` —
# `pip install iolake-sdk` then `import iolake`, the same shape as
# python-dateutil → dateutil.
name = "iolake-sdk"
version = "0.1.0rc1"
description = "Client for the IOLake management API (/_admin/*)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "IOLake" }]
keywords = ["iolake", "s3", "object-storage", "iam", "provisioning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Distributed Computing",
]
# No dependencies, deliberately: SigV4 is implemented on the standard library
# so this installs into an operator or a provisioning job without dragging in
# botocore.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/io-lake/iolake"
Source = "https://github.com/io-lake/iolake-python-sdk"
Issues = "https://github.com/io-lake/iolake/issues"

[tool.setuptools.packages.find]
include = ["iolake*"]
